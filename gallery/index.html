<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElicitJS gallery study</title>
  <meta name="description" content="Every Vega-Lite and Observable Plot gallery example, recreated in ElicitJS where possible, with live elicitation interfaces for each.">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ccircle cx='11' cy='20' r='4' fill='white'/%3E%3Ccircle cx='21' cy='11' r='4' fill='%23fde68a'/%3E%3C/svg%3E">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <a href="#/">ElicitJS <span>gallery study</span></a>
    </div>
    <input id="search" type="search" placeholder="Filter examples…" aria-label="Filter examples">
    <div class="filters" role="group" aria-label="Filter by outcome">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="full">Recreated</button>
      <button type="button" data-filter="partial">Partly</button>
      <button type="button" data-filter="none">Not supported</button>
    </div>
    <nav id="nav"></nav>
  </aside>
  <button id="menu" type="button" aria-label="Toggle navigation">☰</button>
  <main id="main"><p class="muted" style="padding:2rem">Loading…</p></main>

  <script src="vendor/elicit-bundle.js"></script>
  <script src="vendor/originals-bundle.js"></script>
  <script src="assets/registry.js"></script>
  <script src="originals/catalog.js"></script>
  <script src="originals/vl-specs.js"></script>
  <script src="originals/plot-notebooks.js"></script>
  <script src="entries/manifest.js"></script>
  <script>
    // Entry files are listed once in entries/manifest.js; load them in order,
    // then start the app. Plain <script> insertion works from file:// too.
    (function load(files, i) {
      if (i >= files.length) {
        const s = document.createElement('script'); s.src = 'assets/app.js'; document.body.append(s); return;
      }
      const s = document.createElement('script');
      s.src = 'entries/' + files[i];
      s.onload = s.onerror = function () { load(files, i + 1); };
      document.body.append(s);
    })(window.ENTRY_FILES || [], 0);
  </script>
</body>
</html>
