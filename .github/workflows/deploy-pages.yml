# Build the site and publish it with GitHub Pages.
#
# This repo, elicitjs/elicitjs.github.io, is both the source and the site. Pages
# is set to deploy from GitHub Actions, so nothing built is ever committed: this
# job builds out/ and hands it to Pages as an artifact.
#
# The build runs the same scripts/build-site.mjs you run locally. It expects the
# library checked out beside it, the same layout as on a laptop:
#
#   $GITHUB_WORKSPACE/
#     elicitjs-docs/   this repo (the folder keeps its old name, which the
#                      library's verify scripts look for locally)
#     elicitjs/        the library, imported through the @elicit alias
#
# A push to the library alone does not rebuild the site. Run this workflow by
# hand from the Actions tab (workflow_dispatch) to pick up library changes.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let a newer deploy wait for one in progress rather than cancel it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          path: elicitjs-docs

      - name: Check out library
        uses: actions/checkout@v4
        with:
          repository: elicitjs/elicitjs
          ref: main
          path: elicitjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            elicitjs-docs/package-lock.json
            elicitjs/package-lock.json

      # The library's source imports d3, which resolves from the library's own
      # node_modules, not the docs'. --ignore-scripts skips anything a dev
      # dependency (playwright, vite) would fetch on install.
      - name: Install library dependencies
        working-directory: elicitjs
        run: npm ci --ignore-scripts

      - name: Install site dependencies
        working-directory: elicitjs-docs
        run: npm ci

      - name: Build
        working-directory: elicitjs-docs
        run: npm run build:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: elicitjs-docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
